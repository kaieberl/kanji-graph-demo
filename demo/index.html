<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kanji Graph Demo</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Kanji Graph Demo</h1>
        <p id="status">Loading graph data...</p>
      </div>
      <div class="header-stats" aria-live="polite">
        <span><strong id="nodeCount">-</strong> nodes</span>
        <span><strong id="edgeCount">-</strong> edges</span>
      </div>
    </header>

    <nav class="top-tabs" role="tablist" aria-label="Demo views">
      <button class="tab-button active" type="button" data-tab="lookup">Lookup</button>
      <button class="tab-button" type="button" data-tab="text">Text</button>
    </nav>

    <main class="workspace">
      <section class="tab-view active" id="lookupView">
        <article class="panel lookup-search-panel">
          <form id="lookupForm">
            <label for="lookupInput">Kanji or component</label>
            <div class="inline-controls">
              <input id="lookupInput" name="lookup" value="時" maxlength="4" autocomplete="off">
              <button type="submit">Inspect</button>
            </div>
          </form>
          <label for="graphNodeLimit">Node limit</label>
          <input id="graphNodeLimit" type="range" min="4" max="40" value="12">
          <div class="range-value"><span id="graphNodeLimitValue">12</span></div>
        </article>

        <section class="lookup-results" id="lookupResults" aria-live="polite"></section>

        <article class="panel graph-panel" id="graphPanel">
          <div class="panel-title-row">
            <h2 id="graphTitle">Graph</h2>
            <span id="graphMeta" class="meta"></span>
          </div>
          <div id="graphSvg" class="graph-canvas" role="img" aria-label="Kanji graph visualization"></div>
        </article>
      </section>

      <section class="tab-view text-view" id="textView">
        <article class="panel text-controls-panel">
          <div class="section-heading">
            <h2>Text</h2>
          </div>
          <label for="textInput">Japanese text</label>
          <textarea id="textInput" rows="8">風が夜を吹き抜け、世界に変革をもたらす香りを運んできた。彼は一瞬考慮した上で、木々や茂みに隠れるように指示した。</textarea>
          <label for="knownLevel">Known through level</label>
          <select id="knownLevel">
            <option value="10">10</option>
            <option value="9" selected>9</option>
            <option value="8">8</option>
            <option value="7">7</option>
            <option value="6">6</option>
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </article>

        <article class="panel text-results" id="textResults" aria-live="polite"></article>
        <article class="panel text-unknown-panel" id="textUnknown" aria-live="polite"></article>
        <article class="panel text-histogram-panel" id="textHistogram" aria-live="polite"></article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
