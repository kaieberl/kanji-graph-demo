[project]
name = "kanji-graph-demo"
version = "0.1.0"
description = "Reproducible code and data for the kanji component graph demo."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "networkx",
  "openai",
  "python-dotenv",
  "sudachidict_core",
  "SudachiPy",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
